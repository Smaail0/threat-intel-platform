version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: threat_postgres
    environment:
      POSTGRES_DB: threatintel
      POSTGRES_USER: threatuser
      POSTGRES_PASSWORD: threatpass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    container_name: threat_redis
    ports:
      - "6379:6379"

  vector:
    image: timberio/vector:latest-alpine
    container_name: vector

    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
      - ./honeypots/cowrie/logs:/cowrie-logs:ro

    command: ["--config", "/etc/vector/vector.toml"]

    depends_on:
      - postgres

    ports:
      - "8686:8686"

volumes:
  postgres_data: